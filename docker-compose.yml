services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sited
      POSTGRES_USER: sited
      POSTGRES_PASSWORD: sited_dev_password
    ports:
      - "5432:5432"
    volumes:
      - sited-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sited -d sited"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sited-db-data:
